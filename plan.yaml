# Dashboard Implementation Plan
# Generated by dashboard-planner agent

dashboard:
  name: "va-reform-dashboard"
  title: "Virginia tax and benefit reform calculator"
  description: >
    An interactive calculator that lets users model the impact of open-ended reforms
    to the Child Tax Credit (CTC), Earned Income Tax Credit (EITC), and income tax
    rates at both the federal and Virginia state levels for Virginia residents. Users
    configure their household (filing status, ages, dependents, income) and adjust
    reform parameters across three domains: federal income tax brackets, federal
    CTC/EITC, and Virginia income tax rates/EITC. The tool shows household-level
    impacts via line charts and summary metrics, plus statewide impacts via
    microsimulation (revenue change, winners/losers, poverty, distributional analysis).
  country: us
  audience: public

data_pattern: custom-modal

custom_modal:
  reason: >
    The dashboard requires two capabilities that simpler patterns cannot provide:
    (1) Custom reform parameters — users vary federal income tax bracket rates,
    federal CTC amount/phase-out, federal EITC maximums, Virginia income tax rates,
    and Virginia EITC match rate. These are not exposed as configurable inputs in the
    PolicyEngine household API. They require programmatic reform application via
    policyengine-us Simulation with parameter overrides.
    (2) Microsimulation — the "Statewide impact" tab needs population-level analysis
    (revenue change, winners/losers, poverty, decile impacts) for arbitrary user-defined
    reforms, which requires running policyengine-us Microsimulation with the Enhanced CPS
    dataset. Neither the precomputed nor the API pattern supports arbitrary reform
    microsimulation. The parameter space is continuous and open-ended (users can set any
    combination of rates), making precomputation infeasible.
  policyengine_package: policyengine-us
  policyengine_version: "1.554.1"
  architecture: gateway-polling
  backend_files:
    image_setup: backend/_image_setup.py
    worker_app: backend/app.py
    simulation: backend/simulation.py
    gateway: backend/modal_app.py

  # ──────────────────────────────────────────────────────────────────────
  # IMPORTANT: Verified parameter structure notes for the builder agent
  # ──────────────────────────────────────────────────────────────────────
  #
  # Virginia income tax rate structure:
  #   VA uses graduated brackets at gov.states.va.tax.income.rates:
  #     Bracket 0: $0–$3,000 at 2%
  #     Bracket 1: $3,000–$5,000 at 3%
  #     Bracket 2: $5,000–$17,000 at 5%
  #     Bracket 3: $17,000+ at 5.75%
  #   Each bracket has both a threshold and a rate.
  #   The reform should allow adjusting each bracket's rate independently
  #   OR provide a simplified "top rate" slider that adjusts bracket 3.
  #
  # Virginia standard deduction:
  #   gov.states.va.tax.income.deductions.standard
  #   Filing-status-indexed: SINGLE=$8,750, JOINT=$17,500,
  #   SEPARATE=$8,750, HEAD_OF_HOUSEHOLD=$8,750, SURVIVING_SPOUSE=$8,750
  #
  # Virginia personal exemption:
  #   gov.states.va.tax.income.exemptions.personal = $930 per person
  #
  # Virginia EITC:
  #   gov.states.va.tax.income.credits.eitc.match.refundable = 0.20
  #   gov.states.va.tax.income.credits.eitc.match.non_refundable = 0.20
  #   The VA EITC is 20% of the federal EITC. Users can choose refundable
  #   or non-refundable. Reform can adjust the match rate.
  #
  # Federal income tax brackets (2026):
  #   gov.irs.income.bracket.rates.1 through .7 = 10%, 12%, 22%, 24%, 32%, 35%, 37%
  #   gov.irs.income.bracket.thresholds.1 through .7 (filing-status-indexed)
  #
  # Federal CTC (2026):
  #   gov.irs.credits.ctc.amount.base: [{threshold: 0, amount: 2200}, {threshold: 17, amount: 0}]
  #   gov.irs.credits.ctc.phase_out.threshold: SINGLE=$200k, JOINT=$400k
  #   gov.irs.credits.ctc.phase_out.amount = $50 per $1,000
  #   gov.irs.credits.ctc.refundable.individual_max = $1,700
  #   gov.irs.credits.ctc.refundable.fully_refundable = False
  #
  # Federal EITC (2026):
  #   gov.irs.credits.eitc.max: indexed by number of children (0–3+)
  #     0 children: $664, 1: $4,427, 2: $7,316, 3+: $8,231
  #   gov.irs.credits.eitc.phase_in_rate: indexed by children
  #   gov.irs.credits.eitc.phase_out.rate: indexed by children
  #   gov.irs.credits.eitc.phase_out.start: indexed by children
  #
  # Household computation approach:
  #   Use the policyengine-us "axes" pattern to sweep employment_income
  #   from $0 to $500k in a single Simulation call (like ACA-Calc / GA reform).
  #   This generates the full earnings-axis data in one call rather than
  #   running hundreds of separate simulations.

  endpoints:
    - name: household-impact
      method: POST
      long_running: false
      worker_timeout: 600
      worker_memory: 32768
      worker_cpu: 8.0
      description: >
        Computes household-level tax and benefit results across a range of
        earnings levels for both baseline and reform scenarios. Uses the
        policyengine-us axes pattern to sweep employment_income in a single
        Simulation call. Returns arrays suitable for line charts plus a
        summary at the user's specific income level.
      inputs:
        - name: filing_status
          type: string
          enum: [single, joint, head_of_household]
        - name: head_age
          type: integer
          default: 40
        - name: spouse_age
          type: integer
          default: 40
          description: Only used when filing_status is joint
        - name: dependent_ages
          type: array[integer]
          default: []
        - name: income
          type: number
          description: The user's specific annual income for the summary card
        - name: reform
          type: object
          properties:
            # --- Federal income tax ---
            - name: federal_bracket_rates
              type: array[number]
              default: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
              description: "Seven federal income tax bracket rates"
            # --- Federal CTC ---
            - name: federal_ctc_amount
              type: number
              default: 2200
              description: "Base CTC amount per qualifying child under 17"
            - name: federal_ctc_phase_out_threshold_single
              type: number
              default: 200000
            - name: federal_ctc_phase_out_threshold_joint
              type: number
              default: 400000
            - name: federal_ctc_refundable_max
              type: number
              default: 1700
              description: "Maximum refundable (ACTC) amount per child"
            - name: federal_ctc_fully_refundable
              type: boolean
              default: false
            # --- Federal EITC ---
            - name: federal_eitc_max_0
              type: number
              default: 664
              description: "Max EITC for 0 qualifying children"
            - name: federal_eitc_max_1
              type: number
              default: 4427
              description: "Max EITC for 1 qualifying child"
            - name: federal_eitc_max_2
              type: number
              default: 7316
              description: "Max EITC for 2 qualifying children"
            - name: federal_eitc_max_3
              type: number
              default: 8231
              description: "Max EITC for 3+ qualifying children"
            # --- Virginia income tax ---
            - name: va_rate_1
              type: number
              default: 0.02
              description: "VA bracket 1 rate ($0–$3,000)"
            - name: va_rate_2
              type: number
              default: 0.03
              description: "VA bracket 2 rate ($3,000–$5,000)"
            - name: va_rate_3
              type: number
              default: 0.05
              description: "VA bracket 3 rate ($5,000–$17,000)"
            - name: va_rate_4
              type: number
              default: 0.0575
              description: "VA bracket 4 rate ($17,000+)"
            - name: va_standard_deduction
              type: number
              default: null
              description: "If null, uses current-law default for filing status"
            # --- Virginia EITC ---
            - name: va_eitc_match_rate
              type: number
              default: 0.20
              description: "VA EITC as a fraction of federal EITC"
      outputs:
        - name: earnings_axis
          type: array[number]
          description: Array of earnings levels ($0 to $500k, ~100 points)
        - name: baseline_net_income
          type: array[number]
        - name: reform_net_income
          type: array[number]
        - name: baseline_federal_tax
          type: array[number]
        - name: reform_federal_tax
          type: array[number]
        - name: baseline_state_tax
          type: array[number]
        - name: reform_state_tax
          type: array[number]
        - name: baseline_eitc
          type: array[number]
        - name: reform_eitc
          type: array[number]
        - name: baseline_ctc
          type: array[number]
        - name: reform_ctc
          type: array[number]
        - name: baseline_mtr
          type: array[number]
          description: Baseline marginal tax rates at each earnings level
        - name: reform_mtr
          type: array[number]
          description: Reform marginal tax rates at each earnings level
        - name: summary
          type: object
          description: Results at the user's specific income level
          properties:
            - name: baseline_federal_tax
              type: number
            - name: reform_federal_tax
              type: number
            - name: baseline_state_tax
              type: number
            - name: reform_state_tax
              type: number
            - name: baseline_ctc
              type: number
            - name: reform_ctc
              type: number
            - name: baseline_eitc
              type: number
            - name: reform_eitc
              type: number
            - name: baseline_net_income
              type: number
            - name: reform_net_income
              type: number
            - name: net_change
              type: number
      policyengine_variables:
        - employment_income
        - income_tax          # TaxUnit — federal income tax
        - va_income_tax       # TaxUnit — Virginia income tax
        - state_income_tax    # TaxUnit — aggregate state tax
        - eitc                # TaxUnit — federal EITC
        - va_eitc             # TaxUnit — Virginia EITC
        - ctc                 # TaxUnit — federal Child Tax Credit
        - household_net_income
        - household_tax
        - household_benefits
        - household_market_income
      policyengine_parameters:
        # Federal income tax
        - gov.irs.income.bracket.rates.1
        - gov.irs.income.bracket.rates.2
        - gov.irs.income.bracket.rates.3
        - gov.irs.income.bracket.rates.4
        - gov.irs.income.bracket.rates.5
        - gov.irs.income.bracket.rates.6
        - gov.irs.income.bracket.rates.7
        # Federal CTC
        - gov.irs.credits.ctc.amount.base
        - gov.irs.credits.ctc.phase_out.threshold
        - gov.irs.credits.ctc.refundable.individual_max
        - gov.irs.credits.ctc.refundable.fully_refundable
        # Federal EITC
        - gov.irs.credits.eitc.max
        # Virginia income tax rates
        - gov.states.va.tax.income.rates
        # Virginia standard deduction
        - gov.states.va.tax.income.deductions.standard
        # Virginia EITC
        - gov.states.va.tax.income.credits.eitc.match.refundable
        - gov.states.va.tax.income.credits.eitc.match.non_refundable

    - name: statewide-impact
      method: POST
      long_running: true
      worker_timeout: 3600
      worker_memory: 32768
      worker_cpu: 8.0
      description: >
        Runs microsimulation comparing baseline to reform for Virginia residents
        using the Enhanced CPS dataset. Returns aggregate revenue change,
        winner/loser counts, poverty impact, and decile-level average income changes.
        This endpoint is expensive (~2-5 minutes). Uses Modal Dict caching with
        a hash of reform params as cache key.
      inputs:
        - name: reform
          type: object
          description: Same reform object as household-impact endpoint
      outputs:
        - name: federal_revenue_change
          type: number
          description: Total federal revenue change for VA residents (dollars)
        - name: state_revenue_change
          type: number
          description: Total VA state revenue change (dollars)
        - name: total_cost
          type: number
          description: Combined revenue change (positive = revenue gain)
        - name: winners
          type: integer
          description: Number of VA households with higher net income under reform
        - name: losers
          type: integer
          description: Number of VA households with lower net income under reform
        - name: unchanged
          type: integer
          description: Number of VA households unaffected
        - name: poverty_rate_change
          type: number
          description: Change in poverty rate (percentage points)
        - name: child_poverty_rate_change
          type: number
          description: Change in child poverty rate (percentage points)
        - name: decile_impacts
          type: array[object]
          description: >
            Array of 10 objects, one per income decile, each with
            decile (1-10), avg_income_change, and pct_change fields
      policyengine_variables:
        - household_net_income
        - in_poverty
        - is_child
        - household_income_decile
        - income_tax
        - va_income_tax
        - state_income_tax
        - eitc
        - va_eitc
        - ctc
        - state_code_str

tech_stack:
  framework: react-nextjs
  ui: "@policyengine/ui-kit"
  styling: tailwind-with-design-tokens
  font: inter
  testing: vitest
  charts: recharts
  state_management: "@tanstack/react-query"
  http_client: fetch
  maps: null  # No maps needed for this dashboard

components:
  # ─── LEFT SIDEBAR ───
  - type: input_form
    id: household-config
    section: sidebar
    title: "Household configuration"
    accordion: true
    default_open: true
    fields:
      - name: filing_status
        input_type: select
        label: "Filing status"
        options:
          - { value: "single", label: "Single" }
          - { value: "joint", label: "Married filing jointly" }
          - { value: "head_of_household", label: "Head of household" }
        default: "single"

      - name: head_age
        input_type: number
        label: "Your age"
        min: 18
        max: 100
        default: 40

      - name: spouse_age
        input_type: number
        label: "Spouse's age"
        min: 18
        max: 100
        default: 40
        visible_when: "filing_status === 'joint'"

      - name: num_dependents
        input_type: number
        label: "Number of dependents"
        min: 0
        max: 10
        default: 0

      - name: dependent_ages
        input_type: dynamic_array
        label: "Dependent ages"
        item_label: "Dependent {n} age"
        min: 0
        max: 18
        default: 5
        count_field: num_dependents

      - name: income
        input_type: slider
        label: "Annual employment income"
        min: 0
        max: 500000
        default: 50000
        step: 1000
        format: currency

  - type: input_form
    id: reform-params-federal-tax
    section: sidebar
    title: "Federal income tax"
    accordion: true
    default_open: false
    fields:
      - name: federal_rate_1
        input_type: slider
        label: "10% bracket rate"
        min: 0
        max: 0.50
        default: 0.10
        step: 0.005
        format: percent
        description: "Current law: 10% ($0–$12,400 single)"

      - name: federal_rate_2
        input_type: slider
        label: "12% bracket rate"
        min: 0
        max: 0.50
        default: 0.12
        step: 0.005
        format: percent
        description: "Current law: 12% ($12,400–$50,400 single)"

      - name: federal_rate_3
        input_type: slider
        label: "22% bracket rate"
        min: 0
        max: 0.50
        default: 0.22
        step: 0.005
        format: percent
        description: "Current law: 22% ($50,400–$105,700 single)"

      - name: federal_rate_4
        input_type: slider
        label: "24% bracket rate"
        min: 0
        max: 0.50
        default: 0.24
        step: 0.005
        format: percent
        description: "Current law: 24% ($105,700–$201,775 single)"

      - name: federal_rate_5
        input_type: slider
        label: "32% bracket rate"
        min: 0
        max: 0.50
        default: 0.32
        step: 0.005
        format: percent
        description: "Current law: 32% ($201,775–$256,225 single)"

      - name: federal_rate_6
        input_type: slider
        label: "35% bracket rate"
        min: 0
        max: 0.50
        default: 0.35
        step: 0.005
        format: percent
        description: "Current law: 35% ($256,225–$640,600 single)"

      - name: federal_rate_7
        input_type: slider
        label: "37% bracket rate"
        min: 0
        max: 0.50
        default: 0.37
        step: 0.005
        format: percent
        description: "Current law: 37% ($640,600+ single)"

  - type: input_form
    id: reform-params-federal-ctc
    section: sidebar
    title: "Federal Child Tax Credit"
    accordion: true
    default_open: false
    fields:
      - name: federal_ctc_amount
        input_type: number
        label: "CTC amount per child"
        min: 0
        max: 10000
        step: 100
        default: 2200
        format: currency
        description: "Current law: $2,200 per child under 17"

      - name: federal_ctc_phase_out_single
        input_type: number
        label: "Phase-out threshold (single)"
        min: 0
        max: 1000000
        step: 5000
        default: 200000
        format: currency

      - name: federal_ctc_phase_out_joint
        input_type: number
        label: "Phase-out threshold (joint)"
        min: 0
        max: 1000000
        step: 5000
        default: 400000
        format: currency

      - name: federal_ctc_refundable_max
        input_type: number
        label: "Max refundable (ACTC) per child"
        min: 0
        max: 10000
        step: 100
        default: 1700
        format: currency
        description: "Current law: $1,700"

      - name: federal_ctc_fully_refundable
        input_type: toggle
        label: "Make fully refundable"
        default: false
        description: "If enabled, entire CTC is refundable"

  - type: input_form
    id: reform-params-federal-eitc
    section: sidebar
    title: "Federal EITC"
    accordion: true
    default_open: false
    fields:
      - name: federal_eitc_max_0
        input_type: number
        label: "Max EITC (0 children)"
        min: 0
        max: 20000
        step: 50
        default: 664
        format: currency

      - name: federal_eitc_max_1
        input_type: number
        label: "Max EITC (1 child)"
        min: 0
        max: 20000
        step: 50
        default: 4427
        format: currency

      - name: federal_eitc_max_2
        input_type: number
        label: "Max EITC (2 children)"
        min: 0
        max: 20000
        step: 50
        default: 7316
        format: currency

      - name: federal_eitc_max_3
        input_type: number
        label: "Max EITC (3+ children)"
        min: 0
        max: 20000
        step: 50
        default: 8231
        format: currency

  - type: input_form
    id: reform-params-va-tax
    section: sidebar
    title: "Virginia income tax"
    accordion: true
    default_open: false
    fields:
      - name: va_rate_1
        input_type: slider
        label: "Bracket 1 rate ($0–$3k)"
        min: 0
        max: 0.10
        default: 0.02
        step: 0.005
        format: percent
        description: "Current law: 2%"

      - name: va_rate_2
        input_type: slider
        label: "Bracket 2 rate ($3k–$5k)"
        min: 0
        max: 0.10
        default: 0.03
        step: 0.005
        format: percent
        description: "Current law: 3%"

      - name: va_rate_3
        input_type: slider
        label: "Bracket 3 rate ($5k–$17k)"
        min: 0
        max: 0.10
        default: 0.05
        step: 0.005
        format: percent
        description: "Current law: 5%"

      - name: va_rate_4
        input_type: slider
        label: "Bracket 4 rate ($17k+)"
        min: 0
        max: 0.10
        default: 0.0575
        step: 0.0025
        format: percent
        description: "Current law: 5.75%"

      - name: va_standard_deduction
        input_type: number
        label: "Standard deduction"
        min: 0
        max: 50000
        step: 250
        format: currency
        default_dynamic: >
          filing_status === 'joint' ? 17500 : 8750
        description: "Current law: $8,750 single / $17,500 joint"

  - type: input_form
    id: reform-params-va-eitc
    section: sidebar
    title: "Virginia EITC"
    accordion: true
    default_open: false
    fields:
      - name: va_eitc_match_rate
        input_type: slider
        label: "VA EITC match rate"
        min: 0
        max: 1.0
        default: 0.20
        step: 0.05
        format: percent
        description: "Current law: 20% of federal EITC"

  # ─── MAIN CONTENT: TABS ───
  - type: tab_container
    id: main-tabs
    section: main
    tabs:
      - id: household-impact
        label: "Household impact"
      - id: statewide-impact
        label: "Statewide impact"

  # ─── TAB 1: HOUSEHOLD IMPACT ───
  - type: metric_card
    id: household-summary
    tab: household-impact
    title: "Your household impact"
    layout: grid-2x4
    metrics:
      - label: "Federal tax (baseline)"
        value_variable: summary.baseline_federal_tax
        format: currency
      - label: "Federal tax (reform)"
        value_variable: summary.reform_federal_tax
        format: currency
      - label: "VA tax (baseline)"
        value_variable: summary.baseline_state_tax
        format: currency
      - label: "VA tax (reform)"
        value_variable: summary.reform_state_tax
        format: currency
      - label: "CTC (baseline)"
        value_variable: summary.baseline_ctc
        format: currency
      - label: "CTC (reform)"
        value_variable: summary.reform_ctc
        format: currency
      - label: "EITC (baseline)"
        value_variable: summary.baseline_eitc
        format: currency
      - label: "EITC (reform)"
        value_variable: summary.reform_eitc
        format: currency
      - label: "Net income change"
        value_variable: summary.net_change
        format: currency_signed
        color_rule: "positive=chart-1, negative=destructive"
        span: 2

  - type: chart
    id: net-income-by-earnings
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Net income by earnings level"
    description: "Compares household net income under baseline and reform across earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_net_income
        label: "Baseline"
        color: chart-5
        stroke_style: dashed
      - variable: reform_net_income
        label: "Reform"
        color: chart-1
    annotation:
      type: vertical_line
      variable: income
      label: "Your income"
      color: muted-foreground
      stroke_style: dotted
    responsive:
      mobile_height: 250
      desktop_height: 400

  - type: chart
    id: federal-tax-by-earnings
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Federal income tax by earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_federal_tax
        label: "Baseline"
        color: chart-5
        stroke_style: dashed
      - variable: reform_federal_tax
        label: "Reform"
        color: chart-1
    annotation:
      type: vertical_line
      variable: income
      label: "Your income"
      color: muted-foreground
      stroke_style: dotted
    responsive:
      mobile_height: 250
      desktop_height: 350

  - type: chart
    id: state-tax-by-earnings
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Virginia income tax by earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_state_tax
        label: "Baseline"
        color: chart-5
        stroke_style: dashed
      - variable: reform_state_tax
        label: "Reform"
        color: chart-2
    annotation:
      type: vertical_line
      variable: income
      label: "Your income"
      color: muted-foreground
      stroke_style: dotted
    responsive:
      mobile_height: 250
      desktop_height: 350

  - type: chart
    id: credits-by-earnings
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Tax credits by earnings (CTC + EITC)"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_ctc
        label: "CTC (baseline)"
        color: chart-5
        stroke_style: dashed
      - variable: reform_ctc
        label: "CTC (reform)"
        color: chart-1
      - variable: baseline_eitc
        label: "EITC (baseline)"
        color: chart-4
        stroke_style: dashed
      - variable: reform_eitc
        label: "EITC (reform)"
        color: chart-2
    annotation:
      type: vertical_line
      variable: income
      label: "Your income"
      color: muted-foreground
      stroke_style: dotted
    responsive:
      mobile_height: 250
      desktop_height: 350

  - type: chart
    id: marginal-rate-comparison
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Marginal tax rate comparison"
    description: "Shows combined marginal tax rates under baseline and reform across earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_mtr
        label: "Baseline MTR"
        color: chart-5
        stroke_style: dashed
      - variable: reform_mtr
        label: "Reform MTR"
        color: chart-1
    y_axis:
      format: percent
      domain: [0, 0.6]
    responsive:
      mobile_height: 250
      desktop_height: 400

  # ─── TAB 2: STATEWIDE IMPACT ───
  - type: metric_card
    id: statewide-summary
    tab: statewide-impact
    title: "Statewide impact summary"
    layout: grid-2x2
    metrics:
      - label: "Federal revenue change (VA)"
        value_variable: federal_revenue_change
        format: currency_billions
        color_rule: "positive=chart-1, negative=destructive"
      - label: "State revenue change"
        value_variable: state_revenue_change
        format: currency_billions
        color_rule: "positive=chart-1, negative=destructive"
      - label: "Winners"
        value_variable: winners
        format: number_compact
      - label: "Losers"
        value_variable: losers
        format: number_compact

  - type: metric_card
    id: poverty-detail
    tab: statewide-impact
    title: "Poverty impact"
    layout: grid-1x2
    metrics:
      - label: "Overall poverty rate change"
        value_variable: poverty_rate_change
        format: percentage_points
        color_rule: "negative=chart-1, positive=destructive"
      - label: "Child poverty rate change"
        value_variable: child_poverty_rate_change
        format: percentage_points
        color_rule: "negative=chart-1, positive=destructive"

  - type: chart
    id: decile-chart
    tab: statewide-impact
    chart_type: bar
    component_ref: "app-v2:ChartContainer"
    title: "Average income change by decile"
    description: "Shows how the reform affects Virginia households across the income distribution"
    x:
      variable: decile
      label: "Income decile"
      format: ordinal
    y:
      - variable: avg_income_change
        label: "Average income change"
        color: chart-1
        color_rule: "negative_bars=destructive"
    responsive:
      mobile_height: 250
      desktop_height: 350

embedding:
  register_in_apps_json: true
  display_with_research: true
  slug: "va-reform-dashboard"
  tags: ["us", "policy", "interactives", "state", "virginia"]

tests:
  api_tests:
    - name: "single_filer_baseline"
      description: "Single filer at $50k, all default reform params — results should match baseline"
      input:
        filing_status: "single"
        head_age: 40
        dependent_ages: []
        income: 50000
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 2200
          federal_ctc_phase_out_threshold_single: 200000
          federal_ctc_phase_out_threshold_joint: 400000
          federal_ctc_refundable_max: 1700
          federal_ctc_fully_refundable: false
          federal_eitc_max_0: 664
          federal_eitc_max_1: 4427
          federal_eitc_max_2: 7316
          federal_eitc_max_3: 8231
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_standard_deduction: null
          va_eitc_match_rate: 0.20
      expected:
        summary:
          net_change:
            equals: 0
            tolerance: 1

    - name: "federal_rate_cut_benefit"
      description: "Cutting federal top rate from 37% to 30% should reduce tax for high earner"
      input:
        filing_status: "single"
        head_age: 40
        dependent_ages: []
        income: 500000
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.30]
          federal_ctc_amount: 2200
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_eitc_match_rate: 0.20
      expected:
        summary:
          net_change:
            min: 0

    - name: "ctc_increase_with_children"
      description: "Increasing CTC to $5,000 should benefit family with children"
      input:
        filing_status: "joint"
        head_age: 35
        spouse_age: 33
        dependent_ages: [5, 8, 12]
        income: 80000
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 5000
          federal_ctc_phase_out_threshold_single: 200000
          federal_ctc_phase_out_threshold_joint: 400000
          federal_ctc_refundable_max: 1700
          federal_ctc_fully_refundable: false
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_eitc_match_rate: 0.20
      expected:
        summary:
          reform_ctc:
            min: 5000
            description: "3 qualifying children at $5,000 each (before phase-out)"
          net_change:
            min: 0

    - name: "va_rate_increase_impact"
      description: "Raising VA top rate from 5.75% to 8% should increase VA tax"
      input:
        filing_status: "single"
        head_age: 40
        dependent_ages: []
        income: 100000
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 2200
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.08
          va_eitc_match_rate: 0.20
      expected:
        summary:
          reform_state_tax:
            greater_than: summary.baseline_state_tax
          net_change:
            max: 0

    - name: "zero_income_zero_tax"
      description: "Zero income should produce zero tax"
      input:
        filing_status: "single"
        head_age: 30
        dependent_ages: []
        income: 0
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 2200
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_eitc_match_rate: 0.20
      expected:
        summary:
          baseline_federal_tax: 0
          baseline_state_tax: 0

    - name: "va_eitc_match_increase"
      description: "Increasing VA EITC match from 20% to 50% should boost EITC for low-income"
      input:
        filing_status: "single"
        head_age: 30
        dependent_ages: [5]
        income: 20000
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 2200
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_eitc_match_rate: 0.50
      expected:
        summary:
          reform_eitc:
            greater_than: summary.baseline_eitc
          net_change:
            min: 0

    - name: "statewide_default_params"
      description: "Statewide impact with current-law defaults should show near-zero changes"
      endpoint: statewide-impact
      input:
        reform:
          federal_bracket_rates: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
          federal_ctc_amount: 2200
          federal_ctc_phase_out_threshold_single: 200000
          federal_ctc_phase_out_threshold_joint: 400000
          federal_ctc_refundable_max: 1700
          federal_ctc_fully_refundable: false
          federal_eitc_max_0: 664
          federal_eitc_max_1: 4427
          federal_eitc_max_2: 7316
          federal_eitc_max_3: 8231
          va_rate_1: 0.02
          va_rate_2: 0.03
          va_rate_3: 0.05
          va_rate_4: 0.0575
          va_standard_deduction: null
          va_eitc_match_rate: 0.20
      expected:
        total_cost:
          min: -1000000
          max: 1000000
          description: "Near zero since reform matches baseline"

  frontend_tests:
    - name: "renders_without_errors"
      description: "All components mount successfully with default state"
    - name: "sidebar_accordion_toggles"
      description: "All reform parameter sections expand/collapse independently"
    - name: "charts_receive_data"
      description: "Line and bar charts render with correct data shape after API response"
    - name: "tab_switching"
      description: "Switching between Household impact and Statewide impact tabs works"
    - name: "input_validation"
      description: "Form rejects invalid inputs (negative income, rates > 50%, etc.)"
    - name: "spouse_field_visibility"
      description: "Spouse age field appears only when filing status is joint"
    - name: "dependent_age_fields"
      description: "Correct number of dependent age inputs render based on num_dependents"
    - name: "slider_updates_value"
      description: "Tax rate sliders update displayed percentages in real time"
    - name: "loading_state_displayed"
      description: "Loading spinner shown while waiting for API response, especially for statewide tab"

  design_compliance:
    - name: "uses_design_tokens"
      description: "No hardcoded colors — all from @policyengine/ui-kit theme CSS variables"
    - name: "inter_font"
      description: "Inter font loaded via Google Fonts CDN and applied via var(--font-sans)"
    - name: "sentence_case"
      description: "All headings and labels use sentence case"
    - name: "responsive_breakpoints"
      description: "Layout adapts at 768px (sidebar collapses) and 480px (fields stack)"
    - name: "recharts_tokens"
      description: "All Recharts fill/stroke use var(--chart-N) pattern, not hex values"
    - name: "negative_currency_format"
      description: "Negative dollar values display as -$100, not $-100"
    - name: "niceticks_and_auto_domain"
      description: "All Recharts axes use niceTicks with domain=['auto','auto']"
    - name: "favicon_present"
      description: "PolicyEngine favicon is set from ui-kit teal-square.svg"

  embedding_tests:
    - name: "country_detection"
      description: "Reads country from #country= hash parameter"
    - name: "hash_sync"
      description: "Input changes update URL hash and postMessage to parent"
    - name: "share_urls"
      description: "Share URLs point to policyengine.org, not Vercel"
